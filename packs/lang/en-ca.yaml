# English (Canada) (en-ca)
#
# eSpeak voice: en-us (American IPA base).  All platforms map en-ca
# to eSpeak en-us so we get American-style taps, LOT, GOAT, etc.
# This pack then layers Canadian-specific adjustments on top.
#
# Key Canadian features:
#   1. Canadian Raising: PRICE/MOUTH onset raised before voiceless
#   2. COT-CAUGHT merger: LOT and THOUGHT merge
#   3. GOAT backing: no American fronting

settings:
  # Canada is largely closer to US timing than the UK baseline in en.yaml.
  lengthenedScale: 1.05
  # Keep the same fronted GOOSE vowel as the base English pack.
  englishLongUKey: "ᵿ"
  # Helps "bank" / "think" / "thanks" etc feel less "boxy" by giving nasal+stop
  # clusters a tiny bit of separation.
  stopClosureAfterNasalsEnabled: true
  allophoneRulesEnabled: true

normalization:
  preReplacements:
    # eSpeak (classic) can pronounce "Microsoft" with /ɑ(ː)/ for the "-soft" syllable
    # in some English voices. "soft" itself is /sɔft/, so normalize the compound.
    #
    # This is intentionally narrow: it only matches secondary-stressed "soft".
    - from: "sˌɑːft"
      to:   "sˌɔft"
    - from: "sˌɑft"
      to:   "sˌɔft"

    # Canadian "sorry" uses FORCE vowel /ɔːɹ/ ("sore-y"), not LOT /ɑːɹ/ ("sarry").
    - from: "sˈɑːɹi"
      to:   "sˈɔːɹi"

    # ── PRICE and MOUTH, with Canadian Raising (#188) ────────────
    # These rules used to sit in replacements, where they never ran: en.yaml's
    # a → æ comes first there, so "my" was æ + ɪ and "house" æ + ʊ, two vowels
    # each.  Here they run before it, the way en-us keeps its PRICE and MOUTH.
    #
    # Canadian Raising (Joos 1942, "A phonological dilemma in Canadian
    # English", Language 18: 141-144; Chambers 1973, "Canadian raising",
    # Canadian Journal of Linguistics 18: 113-135): before a voiceless
    # consonant inside the word the diphthong starts higher, [ʌɪ] and [ʌʊ]:
    # "right", "ice", "knife", "out", "house", "about".  Elsewhere it starts
    # low, as in en-us: "ride", "eyes", "time", "my", "loud", "how", "down".
    # Measured in Winnipeg, the onset's F1 is about 200 Hz lower before /t/
    # (Hagiwara 2005, "Revisiting the Canadian English vowel space", Journal
    # of the Acoustical Society of America 117, doi:10.1121/1.4787300); here
    # ʌ's F1 is 120 Hz below ɑ's (580 against 700) and 150 Hz below ä's (730).
    #
    # One spelling first.  eSpeak NG ties its diphthongs (a͡ɪ) when a host asks
    # for ties, and not on its command line.  A tie written over one that was
    # already there is dropped after this phase, and en-ca has no
    # autoTieDiphthongs to put it back (that would tie its other vowel pairs
    # as well); a rule that makes the text longer keeps what it wrote.
    - from: "a͡ɪ"
      to:   "aɪ"
    - from: "a͡ʊ"
      to:   "aʊ"

    # No raising before the stressed syllable: stress on the next syllable can
    # stop it (Chambers 1973, as Thomas 1991, "The origin of Canadian Raising
    # in Ontario", Canadian Journal of Linguistics 36, sums it up), so
    # "citation", "titanic" and "myself" keep the low onset while "cite" and
    # "titan" are raised.  eSpeak NG writes the stress mark before the vowel,
    # so the consonant that opens the stressed syllable has the mark right
    # after it.
    - from: "aɪ"
      to:   "ɑ͡ɪ"
      when:
        beforeClass: VOICELESS_BEFORE_STRESS
    - from: "aɪ"
      to:   "ʌ͡ɪ"
      when:
        beforeClass: VOICELESS_OBSTRUENTS
    - from: "aɪ"
      to:   "ɑ͡ɪ"

    # MOUTH.  The glide is written ʊ̞, which is what en.yaml makes of every
    # English ʊ; these rules keep what they write, so it is spelled out.
    - from: "aʊ"
      to:   "ʌ͡ʊ̞"
      when:
        beforeClass: VOICELESS_OBSTRUENTS
    - from: "aʊ"
      to:   "ä͡ʊ̞"

  classes:
    # Vowels (including schwa/r-colored and extra internal keys used by English packs).
    VOWELS: ["a", "e", "i", "o", "u", "ɐ", "ə", "ɜ", "ɝ", "ɑ", "ɒ", "ɔ", "ɛ", "æ", "ʊ", "ɪ", "ᵾ", "ᵿ", "ᴏ", "ᴐ", "ᴒ", "ã", "ẽ", "ĩ", "õ", "ũ", "ᴜ"]

    # Voiceless obstruents — Canadian Raising triggers before these.
    # ɾ: eSpeak NG's en-us writes the flap only for /t/ ("writer" ɹˈaɪɾɚ,
    # "rider" ɹˈaɪdɚ), and "writer" normally has the raised vowel (Chambers
    # 1973).  No h: it only ever opens a syllable ("cowhide", "eyehole").
    VOICELESS_OBSTRUENTS: ["p", "t", "k", "f", "θ", "s", "ʃ", "ʔ", "ɾ"]

    # One voiceless consonant and then the primary stress mark: the consonant
    # opens the stressed syllable ("citation" saɪtˈeɪʃən).
    VOICELESS_BEFORE_STRESS: ["pˈ", "tˈ", "kˈ", "fˈ", "θˈ", "sˈ", "ʃˈ"]

    # The tie bar (U+0361) that preReplacements put inside PRICE and MOUTH.
    # It is a combining mark with nothing under it; if an editor drops it,
    # "my" turns into "moy" and tests/test_en_ca_raising.py fails.
    TIE_BAR: ["͡"]

  replacements:

    # Acronyms like "NVDA" / "GPDA" end in ...diːˈeɪ. If we rewrite eɪ -> ej,
    # the final letter "A" can sound like "dee-yay". Keep that final A as a
    # long monophthong instead.
    - from: "iːˈeɪ"
      to:   "iːˈeː"
    - from: "iːˈe͡ɪ"
      to:   "iːˈeː"
    - from: "iːˌeɪ"
      to:   "iːˌeː"
    - from: "iːˌe͡ɪ"
      to:   "iːˌeː"

    # Make FACE (eɪ) sound like a real diphthong instead of a flat "e".
    - from: "eɪ"
      to:   "ej"
    - from: "e͡ɪ"
      to:   "e͡j"

    # ── GOAT ─────────────────────────────────────────────────────
    # Canadian GOAT stays backed — no American fronting (o → ᵒ).
    # Diphthong collapse pass handles tying, same as en-us.

    # Use a slightly less-fronted GOOSE vowel in US/CA to avoid an overly "oo" quality
    # in words like "grouping" and "toolbar".
    - from: "ᵾ"
      to: "ᵿ"

    # Reduced vowel ɐ can sound a bit "boxy" in our formant table.
    # Use a more neutral schwa for US/CA.
    - from: "ɐ"
      to: "ə"

    # ── COT-CAUGHT merger ────────────────────────────────────────
    # THOUGHT: make /ɔ/ more open (same as en-us baseline).
    - from: "ɔː"
      to: "ᴐː"
    - from: "ɔ"
      to: "ᴐ"

    # NOTE:
    # We intentionally *do not* undo the base English fronting of long /uː/.
    # It helps avoid the "roo" quality in words like "rules".
    # Force rhotic NURSE.
    - from: "ɜː"
      to: "ɝː"
    - from: "ɜ"
      to: "ɝ"

    # START lexical set (park, party, shard, card, garden, market…):
    # Same fix as en-us — ɑ before ɹ sounds too open/Australian in the
    # formant synth.  Map to ʌ for natural North American "ah" quality.
    - from: "ɑːɹ"
      to:   "ʌɹ"
    - from: "ɑɹ"
      to:   "ʌɹ"

    # COT-CAUGHT merger: remaining LOT vowels (not consumed by START above)
    # merge with THOUGHT. "cot" = "caught", "Don" = "dawn".
    - from: "ɑː"
      to:   "ᴐː"
    # Not the onset of PRICE (ɑ͡ɪ, tied in preReplacements): "my" is not "moy".
    - from: "ɑ"
      to:   "ᴐ"
      when:
        notBeforeClass: TIE_BAR

    # Use the dedicated US/CA /r/ variant.
    - from: "ɹ"
      to: "ɻ"
